<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="320" height="384">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121319" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes gentleSwing {
      0% { transform: rotate(2deg); }
      50% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .swinger {
      transform-origin: 200px 0px;
      animation: gentleSwing 5s ease-in-out infinite;
    }
    .blink {
      animation: statusBlink 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Ceiling Mount Anchor -->
  <rect x="180" y="0" width="40" height="10" rx="3" fill="#27272a" />
  <circle cx="200" cy="5" r="2.5" fill="#71717a" />

  <g class="swinger">
    <!-- Minimalist Black Woven Strap -->
    <path d="M 193 8 L 192 85 L 208 85 L 207 8 Z" fill="url(#strapGrad)" />
    <!-- Fine side stitching -->
    <line x1="194" y1="8" x2="193" y2="85" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="206" y1="8" x2="207" y2="85" stroke="#3f3f46" stroke-width="0.8" stroke-dasharray="2,2" />

    <!-- Matte Black Metal Swivel Hook & Ring -->
    <circle cx="200" cy="90" r="7" fill="none" stroke="#52525b" stroke-width="2.5" />
    <rect x="197" y="96" width="6" height="12" rx="1.5" fill="#3f3f46" />
    <path d="M 196 107 C 196 114, 204 114, 204 107 Z" fill="#52525b" />

    <!-- Badge Card (Sleek Engineer ID) -->
    <g transform="translate(65, 112)" filter="url(#softShadow)">
      <!-- Card Body -->
      <rect x="0" y="0" width="270" height="350" rx="16" fill="url(#cardSurface)" stroke="url(#cardBorder)" stroke-width="1.2" />

      <!-- Lanyard Slot Punch Hole -->
      <rect x="115" y="8" width="40" height="6" rx="3" fill="#090a0f" stroke="#27272a" stroke-width="1" />

      <!-- Header: Minimalist Org / Badge Type -->
      <text x="24" y="38" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">ENGINEER PASS</text>
      <text x="246" y="38" text-anchor="end" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="1">DEV-2026</text>

      <line x1="24" y1="48" x2="246" y2="48" stroke="#1f2430" stroke-width="1" />

      <!-- Avatar Photo Placeholder -->
      <g transform="translate(24, 62)">
        <rect x="0" y="0" width="70" height="70" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <!-- Sleek silhouette icon -->
        <circle cx="35" cy="28" r="14" fill="#3f3f46" />
        <path d="M 15 62 C 15 48, 55 48, 55 62 Z" fill="#3f3f46" />
      </g>

      <!-- Primary Info -->
      <g transform="translate(106, 68)">
        <text x="0" y="16" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Shamith R</text>
        <text x="0" y="32" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="10">@rshamith777-cpu</text>
        <text x="0" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Full-Stack Engineer</text>
      </g>

      <!-- Live Git Activity Strip -->
      <g transform="translate(24, 150)">
        <rect x="0" y="0" width="222" height="42" rx="8" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
        
        <!-- Status Indicator -->
        <circle class="blink" cx="16" cy="21" r="4" fill="#22c55e" />
        <text x="28" y="24" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Status:</text>
        <text x="68" y="24" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Available for builds</text>

        <text x="210" y="24" text-anchor="end" fill="#71717a" font-family="'JetBrains Mono', monospace" font-size="9">GIT-LIVE</text>
      </g>

      <!-- Focus Areas -->
      <g transform="translate(24, 210)">
        <text x="0" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">SPECIALIZATIONS</text>
        
        <!-- Tag Pills -->
        <rect x="0" y="10" width="95" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
        <text x="47" y="23" text-anchor="middle" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="9">Web Systems</text>

        <rect x="102" y="10" width="120" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
        <text x="162" y="23" text-anchor="middle" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="9">Interactive Canvas</text>

        <rect x="0" y="36" width="85" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
        <text x="42" y="49" text-anchor="middle" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="9">TypeScript</text>

        <rect x="92" y="36" width="80" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.8" />
        <text x="132" y="49" text-anchor="middle" fill="#d4d4d8" font-family="'JetBrains Mono', monospace" font-size="9">Node.js</text>
      </g>

      <!-- Minimal Barcode -->
      <g transform="translate(24, 290)">
        <line x1="0" y1="0" x2="222" y2="0" stroke="#1f2430" stroke-width="1" />
        
        <g transform="translate(0, 14)">
          <rect x="0" y="0" width="2" height="18" fill="#71717a" />
          <rect x="4" y="0" width="3" height="18" fill="#71717a" />
          <rect x="9" y="0" width="1" height="18" fill="#71717a" />
          <rect x="13" y="0" width="4" height="18" fill="#71717a" />
          <rect x="20" y="0" width="2" height="18" fill="#71717a" />
          <rect x="25" y="0" width="1" height="18" fill="#71717a" />
          <rect x="28" y="0" width="5" height="18" fill="#71717a" />
          <rect x="36" y="0" width="2" height="18" fill="#71717a" />
          <rect x="41" y="0" width="4" height="18" fill="#71717a" />
          <rect x="48" y="0" width="1" height="18" fill="#71717a" />
          <rect x="52" y="0" width="3" height="18" fill="#71717a" />
          <rect x="58" y="0" width="2" height="18" fill="#71717a" />
          <rect x="63" y="0" width="5" height="18" fill="#71717a" />
          <rect x="71" y="0" width="1" height="18" fill="#71717a" />
          <rect x="75" y="0" width="3" height="18" fill="#71717a" />
          <rect x="81" y="0" width="2" height="18" fill="#71717a" />
          <rect x="86" y="0" width="4" height="18" fill="#71717a" />
          <rect x="93" y="0" width="1" height="18" fill="#71717a" />
          <rect x="97" y="0" width="5" height="18" fill="#71717a" />
          <rect x="105" y="0" width="2" height="18" fill="#71717a" />
          <rect x="110" y="0" width="3" height="18" fill="#71717a" />
          <rect x="116" y="0" width="2" height="18" fill="#71717a" />
          <rect x="121" y="0" width="4" height="18" fill="#71717a" />
          <rect x="128" y="0" width="1" height="18" fill="#71717a" />
          <rect x="132" y="0" width="5" height="18" fill="#71717a" />
          <rect x="140" y="0" width="2" height="18" fill="#71717a" />
          <rect x="145" y="0" width="3" height="18" fill="#71717a" />
          <rect x="151" y="0" width="4" height="18" fill="#71717a" />
          <rect x="158" y="0" width="1" height="18" fill="#71717a" />
          <rect x="162" y="0" width="3" height="18" fill="#71717a" />
          <rect x="168" y="0" width="2" height="18" fill="#71717a" />
          <rect x="173" y="0" width="5" height="18" fill="#71717a" />
          <rect x="181" y="0" width="1" height="18" fill="#71717a" />
          <rect x="185" y="0" width="4" height="18" fill="#71717a" />
          <rect x="192" y="0" width="2" height="18" fill="#71717a" />
          <rect x="197" y="0" width="3" height="18" fill="#71717a" />
          <rect x="203" y="0" width="2" height="18" fill="#71717a" />
          <rect x="208" y="0" width="4" height="18" fill="#71717a" />
          <rect x="215" y="0" width="2" height="18" fill="#71717a" />
          <rect x="219" y="0" width="3" height="18" fill="#71717a" />
        </g>
        <text x="222" y="42" text-anchor="end" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="1">ID: 777-RSHAMITH-AUTH</text>
      </g>
    </g>
  </g>
</svg>
